<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Lumen Studio: invoices</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Lumen Studio</h1>
  <p>Design retainers for small brands. Clients pay their invoices here.</p>
  <form id="find"><input id="ref" placeholder="Invoice number, e.g. LUM-204" required><button>Look up</button></form>
  <section id="invoice" hidden>
    <h2 id="title"></h2>
    <p id="amount"></p>
    <button id="pay">Simulate bank payment</button>
    <p id="status"></p>
  </section>
  <script src="app.js"></script>
</body>
</html>
